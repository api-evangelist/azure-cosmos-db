- aid: azure-cosmos-db:data-plane-api
  name: Azure Cosmos DB Data Plane REST API
  description: >-
    REST API for creating, querying, and managing databases, containers, items, stored procedures, triggers,
    user-defined functions, users, and permissions. Authentication uses master keys, resource tokens,
    or Microsoft Entra ID bearer tokens with HMAC-signed authorization headers.
  humanURL: https://learn.microsoft.com/en-us/rest/api/cosmos-db/
  baseURL: https://{databaseaccount}.documents.azure.com
